# OTSA SSH User Access Management Configuration
# Auto-generated by OPNsense — DO NOT EDIT MANUALLY
# Template: OPNsense/Auth/SshManagement

{% set enabled_users = [] %}
{% for user in helpers.toList('system.user') %}
{%   if user.ssh_enabled is defined and user.ssh_enabled == '1' and user.disabled|default('0') != '1' %}
{%     do enabled_users.append(user) %}
{%   endif %}
{% endfor %}

{% if enabled_users %}
# ============================================================
# Per-user SSH access control
# AllowUsers — only enabled users may log in (ANDed with sshd's other ACLs)
# ============================================================
{% set allow_users_parts = [] %}
{% for user in enabled_users %}
{%   set username = user.name %}
{%   set raw_nets = user.ssh_allowed_networks|default('') %}
{%   set nets = [] %}
{%   for net in raw_nets.split(',') %}
{%     if net|trim != '' %}
{%       do nets.append(net|trim) %}
{%     endif %}
{%   endfor %}
{%   if nets|length == 0 or (nets|length == 1 and nets[0] == '0.0.0.0/0') %}
{%     do allow_users_parts.append(username) %}
{%   else %}
{%     for network in nets %}
{%       do allow_users_parts.append(username ~ '@' ~ network) %}
{%     endfor %}
{%   endif %}
{% endfor %}

AllowUsers {{ allow_users_parts|join(' ') }}

# Idle session timeout (60s × 3 missed = 180s)
ClientAliveInterval 60
ClientAliveCountMax 3

{% for user in enabled_users %}
# ------------------------------------------------------------
# User: {{ user.name }}
# Auth: {{ user.ssh_auth_method|default('password') }}
# ------------------------------------------------------------
Match User {{ user.name }}
{% if user.ssh_auth_method is defined and user.ssh_auth_method == 'key_only' %}
    PasswordAuthentication no
    PubkeyAuthentication yes
{% elif user.ssh_auth_method is defined and user.ssh_auth_method == 'both' %}
    PasswordAuthentication yes
    PubkeyAuthentication yes
{% else %}
    PasswordAuthentication yes
    PubkeyAuthentication no
{% endif %}
    AllowTcpForwarding no

{% endfor %}
{% else %}
# No SSH-enabled users configured — drop-in is a no-op.
# Admins fall back to the main sshd_config defaults (PermitRootLogin etc.).
{% endif %}
